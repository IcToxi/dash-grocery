name: Publish Python distribution to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.1.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    env:
      YARN_NODE_LINKER: node-modules

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable Corepack
        run: npm install --global corepack

      - name: Install build and test dependencies
        run: |
          python -m pip install -r requirements.txt build twine
          corepack enable
          yarn install --immutable

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          expected_tag="v$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$RELEASE_TAG" = "$expected_tag"

      - name: Build Dash components
        env:
          REACT_VERSION: "19.2.4"
        run: |
          yarn lint
          yarn build

      - uses: browser-actions/setup-geckodriver@latest

      - name: Run tests
        env:
          REACT_VERSION: "19.2.4"
        run: pytest --webdriver=Firefox tests

      - name: Build and verify Python distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Store distribution packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dash-grocery/
    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
